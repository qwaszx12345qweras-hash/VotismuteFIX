# ============================================================
#  LiteBansMuteHook - конфиг
#  Задача плагина: не давать замученным игрокам
#  писать в чат и использовать /msg, /tell и т.д.
# ============================================================

# Сообщение, которое видит замученный игрок
mute-message: "&cВы заглушены и не можете писать в чат."

# Команды, которые замученный игрок не может использовать
blocked-commands:
  - "msg"
  - "tell"
  - "w"
  - "whisper"
  - "m"
  - "t"
  - "pm"
  - "message"
  - "r"
  - "reply"
  - "me"
  - "say"
  - "mail"
